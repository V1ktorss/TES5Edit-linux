name: BSArch Linux CI

on:
  push:
    branches:
      - dev-4.1.6
      - main
  pull_request:

jobs:
  linux-bsarch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake make

      - name: Build BSArchSE (Qt)
        run: |
          qmake -o linux/.build-bsarch-ui/Makefile linux/bsarch_ui_cpp/bsarch_ui_cpp.pro
          make -C linux/.build-bsarch-ui -j"$(nproc)"
          test -x linux/.build-bsarch-ui/bsarch-ui

      - name: Run Native-Port Preflight
        run: |
          chmod +x linux/native-port/ci-preflight.sh
          if [[ -x linux/bin/bsarch-core ]]; then
            echo "linux/bin/bsarch-core detected: running full native-port checks."
            ENFORCE_STYLE=1 RUN_BSARCH=1 linux/native-port/ci-preflight.sh
          else
            echo "linux/bin/bsarch-core missing: running readiness-focused checks."
            ENFORCE_STYLE=1 RUN_BSARCH=0 linux/native-port/ci-preflight.sh
          fi

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: bsarch-ci-xedit-readiness-report
          path: linux/native-port/reports/xedit-readiness.txt
