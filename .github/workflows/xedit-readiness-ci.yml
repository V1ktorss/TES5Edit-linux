name: xEdit Readiness CI

on:
  push:
    branches:
      - dev-4.1.6
      - main
  pull_request:

jobs:
  xedit-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run xEdit Readiness Check
        run: |
          chmod +x linux/native-port/xedit-readiness-audit.sh
          chmod +x linux/native-port/check-xedit-readiness.sh
          ENFORCE_STYLE=1 linux/native-port/check-xedit-readiness.sh

      - name: Run xEdit Headless Smoke Test
        if: ${{ hashFiles('linux/bin/xedit-core') != '' }}
        run: |
          chmod +x linux/native-port/smoke-test-xedit-headless.sh
          linux/native-port/smoke-test-xedit-headless.sh

      - name: Warn When xedit-core Is Missing
        if: ${{ hashFiles('linux/bin/xedit-core') == '' }}
        run: |
          echo "linux/bin/xedit-core not present in this checkout."
          echo "Headless smoke test was skipped."

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-report
          path: linux/native-port/reports/xedit-readiness.txt
