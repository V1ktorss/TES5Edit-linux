name: xEdit Readiness CI

on:
  push:
    branches:
      - dev-4.1.6
      - main
  pull_request:

jobs:
  xedit-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run xEdit Readiness Check
        run: |
          chmod +x linux/native-port/xedit-readiness-audit.sh
          chmod +x linux/native-port/check-xedit-readiness.sh
          linux/native-port/check-xedit-readiness.sh

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-report
          path: linux/native-port/reports/xedit-readiness.txt
