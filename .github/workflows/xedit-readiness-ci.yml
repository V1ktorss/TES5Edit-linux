name: xEdit Readiness CI

on:
  push:
    branches:
      - dev-4.1.6
      - main
  pull_request:

jobs:
  xedit-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run xEdit Readiness Check
        run: |
          chmod +x linux/native-port/ci-preflight.sh
          ENFORCE_STYLE=1 RUN_BSARCH=0 RUN_WARNING_BUDGET_GUARD=1 XEDIT_INVALID_D_TEST=1 XDUMP_MODE_SANITY_TEST=1 XDUMP_INVALID_D_TEST=1 linux/native-port/ci-preflight.sh

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-report
          path: linux/native-port/reports/xedit-readiness.txt

      - name: Upload GUI surface report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-gui-surface
          path: linux/native-port/reports/xedit-gui-surface.txt
          if-no-files-found: ignore

      - name: Upload xeMainForm message surface report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-xemainform-message-surface
          path: linux/native-port/reports/xemainform-message-surface.txt
          if-no-files-found: ignore

      - name: Upload warning summary report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-warning-summary
          path: linux/native-port/reports/headless-warning-summary.txt
          if-no-files-found: ignore

      - name: Upload warning trend report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-warning-trend
          path: linux/native-port/reports/headless-warning-trend.txt
          if-no-files-found: ignore

      - name: Upload warning hotspots report
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-warning-hotspots
          path: linux/native-port/reports/headless-warning-hotspots.txt
          if-no-files-found: ignore

      - name: Upload headless smoke log
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-headless-log
          path: /tmp/xedit-headless-current.log
          if-no-files-found: ignore

      - name: Upload xEdit smoke logs
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-xedit-smoke-logs
          path: /tmp/xedit-headless-smoke-*.log
          if-no-files-found: ignore

      - name: Upload xDump smoke logs
        uses: actions/upload-artifact@v4
        with:
          name: xedit-readiness-xdump-smoke-logs
          path: /tmp/xdump-headless-smoke-*.log
          if-no-files-found: ignore
